services:
  harbor:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_MODE: live
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-33554432}
      MAX_QUEUE: ${MAX_QUEUE:-50}
      WEB_MAX_TOOL_STEPS: ${WEB_MAX_TOOL_STEPS:-12}
      TASK_WORKERS: ${TASK_WORKERS:-2}
      MOCK_DELAY: ${MOCK_DELAY:-1.1}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      AUTH_ADMIN_TOKEN: ${AUTH_ADMIN_TOKEN:-}
      AUTH_OPERATOR_TOKEN: ${AUTH_OPERATOR_TOKEN:-}
      AUTH_VIEWER_TOKEN: ${AUTH_VIEWER_TOKEN:-}
      HERMES_BRIDGE_URL: ${HERMES_BRIDGE_URL:-}
      HERMES_BRIDGE_TOKEN: ${HERMES_BRIDGE_TOKEN:-}
      HERMES_BRIDGE_SAFE_MODE: ${HERMES_BRIDGE_SAFE_MODE:-0}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-}
      LOCAL_MODEL: ${LOCAL_MODEL:-local-model}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-}
      CLOUD_MODEL: ${CLOUD_MODEL:-configured-model}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-configured-judge}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
    volumes:
      - harbor-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  harbor-data:
